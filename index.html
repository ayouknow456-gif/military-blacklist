<!DOCTYPE html>
<html lang="th">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Military Blacklist System</title>

<style>
body{
    font-family:Arial;
    background:#f5f5f5;
    margin:0;
}

header{
    background:white;
    padding:20px;
    display:flex;
    justify-content:space-between;
    border-bottom:4px solid red;
}

.logo{
    font-size:28px;
    font-weight:bold;
    color:#c40000;
}

button{
    cursor:pointer;
}

.hero{
    max-width:1400px;
    margin:auto;
    padding:20px;
}

.card{
    background:white;
    padding:20px;
    border-left:5px solid red;
    margin:10px 0;
    border-radius:10px;
}

.stats{
    display:grid;
    grid-template-columns:repeat(4,1fr);
    gap:10px;
    margin:20px 0;
}

.stat{
    background:white;
    padding:15px;
    border-radius:10px;
    text-align:center;
}

input,select{
    padding:10px;
    width:100%;
    margin:5px 0;
}

.dashboard{
    display:none;
    background:white;
    padding:20px;
    margin-top:20px;
    border-radius:10px;
}

.modal{
    display:none;
    position:fixed;
    top:0;left:0;
    width:100%;
    height:100%;
    background:rgba(0,0,0,0.5);
    justify-content:center;
    align-items:center;
}

.modal-content{
    background:white;
    padding:20px;
    border-radius:10px;
    width:300px;
}
</style>
</head>

<body>

<header>
<div class="logo">MILITARY BLACKLIST</div>
<button onclick="openLogin()">LOGIN</button>
</header>

<div class="hero">

<h2>ค้นหา</h2>
<input id="searchInput" placeholder="ชื่อ Roblox">
<button onclick="searchUser()">ค้นหา</button>
<div id="result"></div>

<h2>สถิติ</h2>
<div class="stats">
<div class="stat"><div id="total">0</div>ทั้งหมด</div>
<div class="stat"><div id="ok">0</div>อนุมัติ</div>
<div class="stat"><div id="wait">0</div>รอ</div>
<div class="stat"><div id="ban">0</div>ไม่อนุญาต</div>
</div>

<h2>ล่าสุด</h2>
<div id="list"></div>

<div class="dashboard" id="dash">

<h3>เพิ่มข้อมูล</h3>

<input id="name" placeholder="ชื่อ">
<input id="reason" placeholder="เหตุผล">
<input id="time" placeholder="ระยะเวลา">

<select id="status">
<option>❌ ไม่อนุญาต</option>
<option>✅ อนุมัติ</option>
<option>⏳ รอดำเนินการ</option>
</select>

<button onclick="addData()">เพิ่ม</button>

</div>

</div>

<!-- LOGIN -->
<div class="modal" id="login">
<div class="modal-content">
<h3>LOGIN</h3>
<input id="user">
<input id="pass" type="password">
<button onclick="login()">เข้า</button>
</div>
</div>

<script type="module">

import { initializeApp } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-app.js";
import {
getFirestore,
collection,
addDoc,
getDocs
} from "https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore.js";

const firebaseConfig = {
  apiKey: "AIzaSyCviSAymU5TPS9foOlclvBlHR42qI0BCWA",
  authDomain: "military-blacklist.firebaseapp.com",
  projectId: "military-blacklist",
  storageBucket: "military-blacklist.firebasestorage.app",
  messagingSenderId: "705585446302",
  appId: "1:705585446302:web:515ea5e7265e22aaf3aa8f",
  measurementId: "G-K7VD2RSDLH"
};

const app = initializeApp(firebaseConfig);
const db = getFirestore(app);

let data = [];

const admins = [
{u:"adminCAT",p:"admincat0276speed"},
{u:"adminKIM",p:"adminkim1091"},
{u:"adminYOK",p:"adminyok09266ei"}
];

async function load(){

const snap = await getDocs(collection(db,"blacklist"));
data = snap.docs.map(d=>d.data());

render();

}

window.addData = async function(){

let name=document.getElementById("name").value;
let reason=document.getElementById("reason").value;
let time=document.getElementById("time").value;
let status=document.getElementById("status").value;

await addDoc(collection(db,"blacklist"),{
name,reason,time,status,t:Date.now()
});

load();

}

function render(){

let list=document.getElementById("list");
list.innerHTML="";

let ok=0,wait=0,ban=0;

data.sort((a,b)=>b.t-a.t).slice(0,30).forEach(d=>{

if(d.status.includes("อนุมัติ")) ok++;
if(d.status.includes("รอดำเนินการ")) wait++;
if(d.status.includes("ไม่อนุญาต")) ban++;

list.innerHTML+=`
<div class="card">
<h3>${d.name}</h3>
<p>${d.status}</p>
<p>${d.reason}</p>
<p>${d.time}</p>
</div>`;
});

document.getElementById("total").innerText=data.length;
document.getElementById("ok").innerText=ok;
document.getElementById("wait").innerText=wait;
document.getElementById("ban").innerText=ban;

}

window.searchUser=function(){

let v=document.getElementById("searchInput").value.toLowerCase();

let f=data.find(x=>x.name.toLowerCase()==v);

let r=document.getElementById("result");

if(f){
r.innerHTML=`<div class="card"><h3>${f.name}</h3><p>${f.status}</p></div>`;
}else{
r.innerHTML="ไม่พบข้อมูล";
}

}

window.openLogin=()=>document.getElementById("login").style.display="flex";

window.login=function(){

let u=document.getElementById("user").value;
let p=document.getElementById("pass").value;

let ok=admins.find(a=>a.u==u&&a.p==p);

if(ok){
document.getElementById("dash").style.display="block";
document.getElementById("login").style.display="none";
}else{
alert("ผิด");
}

}

load();

</script>

</body>
</html>
