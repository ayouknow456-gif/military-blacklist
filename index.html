<!DOCTYPE html>
<html lang="th">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Military Blacklist System</title>

<style>
body{
    margin:0;
    font-family:Arial;
    background:#0f0f10;
    color:white;
}

header{
    display:flex;
    justify-content:space-between;
    padding:20px;
    background:#141416;
    border-bottom:2px solid red;
}

.logo{
    font-size:22px;
    font-weight:bold;
    color:red;
}

.container{
    max-width:1200px;
    margin:auto;
    padding:20px;
}

.card{
    background:#1a1a1d;
    padding:15px;
    margin:10px 0;
    border-left:4px solid red;
    border-radius:10px;
}

input,select{
    width:100%;
    padding:10px;
    margin:5px 0;
    border:none;
    border-radius:8px;
    background:#222;
    color:white;
}

button{
    padding:10px 15px;
    background:red;
    border:none;
    color:white;
    border-radius:8px;
    cursor:pointer;
}

.stats{
    display:grid;
    grid-template-columns:repeat(4,1fr);
    gap:10px;
    margin:20px 0;
}

.stat{
    background:#1a1a1d;
    padding:10px;
    text-align:center;
    border-radius:10px;
}

/* LOGIN */
.modal{
    display:none;
    position:fixed;
    top:0;left:0;
    width:100%;height:100%;
    background:rgba(0,0,0,0.6);
    justify-content:center;
    align-items:center;
}

.modal-content{
    background:#1a1a1d;
    padding:20px;
    border-radius:10px;
    width:300px;
}
</style>
</head>

<body>

<header>
<div class="logo">MILITARY BLACKLIST</div>
<button onclick="openLogin()">LOGIN</button>
</header>

<div class="container">

<h3>ค้นหา</h3>
<input id="searchInput" placeholder="ชื่อ Roblox">
<button onclick="searchUser()">ค้นหา</button>
<div id="result"></div>

<h3>สถิติ</h3>
<div class="stats">
<div class="stat"><div id="total">0</div>ทั้งหมด</div>
<div class="stat"><div id="ok">0</div>อนุมัติ</div>
<div class="stat"><div id="wait">0</div>รอ</div>
<div class="stat"><div id="ban">0</div>ไม่อนุญาต</div>
</div>

<h3>ล่าสุด (30 รายการ)</h3>
<div id="list"></div>

<!-- DASHBOARD -->
<div id="dash" style="display:none;">

<h3>เพิ่มข้อมูล</h3>

<!-- NETLIFY FORM -->
<form name="blacklist" method="POST" data-netlify="true">

<input type="hidden" name="form-name" value="blacklist">

<input name="name" placeholder="ชื่อ Roblox" required>
<input name="reason" placeholder="เหตุผล" required>
<input name="time" placeholder="ระยะเวลา" required>

<select name="status">
<option>❌ ไม่อนุญาต</option>
<option>✅ อนุมัติ</option>
<option>⏳ รอดำเนินการ</option>
</select>

<button type="submit">เพิ่มข้อมูล</button>

</form>

</div>

</div>

<!-- LOGIN -->
<div class="modal" id="login">
<div class="modal-content">
<h3>LOGIN</h3>
<input id="user">
<input id="pass" type="password">
<button onclick="login()">เข้า</button>
</div>
</div>

<script>

let data = [];

const admins = [
{u:"adminCAT",p:"admincat0276speed"},
{u:"adminKIM",p:"adminkim1091"},
{u:"adminYOK",p:"adminyok09266ei"}
];

/* DEMO DATA (เพราะ Netlify Forms ดึงกลับ API ไม่ง่าย) */
data = [];

function render(){

let list=document.getElementById("list");
list.innerHTML="";

let ok=0,wait=0,ban=0;

data.slice(-30).reverse().forEach(d=>{

if(d.status?.includes("อนุมัติ")) ok++;
if(d.status?.includes("รอดำเนินการ")) wait++;
if(d.status?.includes("ไม่อนุญาต")) ban++;

list.innerHTML+=`
<div class="card">
<h3>${d.name}</h3>
<p>${d.status}</p>
<p>${d.reason}</p>
<p>${d.time}</p>
</div>`;
});

document.getElementById("total").innerText=data.length;
document.getElementById("ok").innerText=ok;
document.getElementById("wait").innerText=wait;
document.getElementById("ban").innerText=ban;

}

window.searchUser=function(){

let v=document.getElementById("searchInput").value.toLowerCase();

let f=data.find(x=>x.name?.toLowerCase()==v);

let r=document.getElementById("result");

if(f){
r.innerHTML=`<div class="card">${f.name}<br>${f.status}</div>`;
}else{
r.innerHTML="ไม่พบข้อมูล";
}

}

window.openLogin=()=>document.getElementById("login").style.display="flex";

window.login=function(){

let u=document.getElementById("user").value;
let p=document.getElementById("pass").value;

let ok=admins.find(a=>a.u==u&&a.p==p);

if(ok){
document.getElementById("dash").style.display="block";
document.getElementById("login").style.display="none";
}else{
alert("ผิด");
}

}

/* NOTE:
Netlify Forms จะเก็บข้อมูลใน Dashboard
แต่เว็บ frontend ต้อง refresh / หรือ export CSV จาก Netlify
*/

render();

</script>

</body>
</html>
